<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三麗鷗角色名字配對遊戲 🎀 Sanrio Match</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sanrioPink: '#ffb3c6',
            sanrioSoftPink: '#ffe5ec',
            sanrioPurple: '#cdb4db',
            sanrioBlue: '#bde0fe',
            sanrioYellow: '#fde2e4',
            sanrioGreen: '#c1fba4'
          },
          fontFamily: {
            rounded: ['ui-rounded', 'Hiragino Maru Gothic ProN', 'Quicksand', 'Comfortaa', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* 遊戲自訂可愛動畫與樣式 */
    body {
      font-family: 'ui-rounded', 'Hiragino Maru Gothic ProN', 'Comfortaa', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 飄浮背景動態 */
    .floating-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bubble {
      position: absolute;
      bottom: -50px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: floatUp 12s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* 翻牌卡片 3D 效果 */
    .card-scene {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
    }
    .card-front {
      background: linear-gradient(135deg, #ffc8dd 0%, #ffafcc 100%);
      border: 3px solid #ffffff;
    }
    .card-back {
      background: #ffffff;
      transform: rotateY(180deg);
      border: 3px solid #ffb3c6;
    }

    /* 答錯晃動動畫 */
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* 答對彈跳動畫 */
    .bounce-celebrate {
      animation: bounce 0.6s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    /* 愛心特效 Canvas */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 min-h-screen text-gray-700 relative overflow-x-hidden flex flex-col justify-between">

  <!-- 飄浮背景裝飾元素 -->
  <div class="floating-bg" id="bubble-bg"></div>

  <!-- 粒子特效 Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- 頂部導覽與狀態列 -->

      <!-- 標題與標誌 -->
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 bg-pink-400 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md">
          🎀
        </div>
        <div>

            三麗鷗角色對對碰

      </div>

      <!-- 控制按鈕與音效 -->

        </button>
        <button onclick="resetGame()" class="px-4 py-2 rounded-2xl bg-purple-400 hover:bg-purple-500 text-white font-bold text-sm shadow-md transition flex items-center space-x-1">
          <i class="fa-solid fa-rotate-right"></i>
          <span>重新開始</span>
        </button>
      </div>
    </div>

    <!-- 模式選擇 Tab -->
    <div class="flex justify-center mt-4">
      <div class="bg-white/70 p-1.5 rounded-full shadow-inner flex space-x-2 border border-pink-200">

          <i class="fa-solid fa-eye mr-1"></i> 看圖猜名字
        </button>
        <button id="tab-memory" onclick="switchMode('memory')" class="px-6 py-2 rounded-full text-sm font-bold transition text-gray-600 hover:bg-white/50">
          <i class="fa-solid fa-clone mr-1"></i> 記憶翻牌配對
        </button>
      </div>
    </div>
  </header>

        <div class="flex justify-between items-center mb-4 text-sm font-bold">
          <div class="bg-pink-100 text-pink-600 px-4 py-1.5 rounded-full flex items-center">
            <span class="mr-1">進度:</span>
            <span id="quiz-progress" class="text-base text-pink-700">1/10</span>
          </div>
          <div class="flex space-x-2">
            <div class="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-full flex items-center">
              <i class="fa-solid fa-fire text-amber-500 mr-1"></i>
              <span>連勝: <span id="quiz-combo">0</span></span>
            </div>
            <div class="bg-purple-100 text-purple-700 px-4 py-1.5 rounded-full flex items-center">
              <span>得分: <span id="quiz-score" class="text-base text-purple-800">0</span></span>
            </div>
          </div>
        </div>

        <div class="relative bg-gradient-to-b from-pink-50 to-purple-50 rounded-2xl p-6 mb-6 flex flex-col items-center justify-center border-2 border-pink-200 shadow-inner group">

          <p class="text-xs text-purple-400 mt-2 font-medium">請問這一位三麗鷗好朋友是誰呢？</p>
        </div>

        <div id="quiz-options" class="grid grid-cols-2 gap-3">
          <!-- 4 個選項按鈕將由 JS 動態生成 -->
        </div>
      </div>
    </section>


    <!-- ================= 模式二：記憶翻牌配對 ================= -->
    <section id="mode-memory" class="hidden">

            <span>已配對: <span id="memory-matches" class="text-base text-pink-800">0 / 6</span></span>

        </div>

        </div>
      </div>
    </section>

  </main>

        svg: `<svg viewBox="0 0 200 200" class="w-full h-full">

    /* -------------------------------------------------------------
       2. 全域遊戲狀態變數
       ------------------------------------------------------------- */
    let currentMode = 'quiz'; // 'quiz' 或 'memory'
    let soundEnabled = true;

    // 模式一：看圖猜名字
    let quizQueue = [];
    let currentQuizIndex = 0;
    let quizScore = 0;
    let quizCombo = 0;

    // 模式二：記憶翻牌
    let memoryCards = [];
    let flippedCards = [];
    let matchedCount = 0;
    let memoryMoves = 0;
    let isBusyFlipping = false;

    /* -------------------------------------------------------------
       3. Web Audio API 可愛音效合成器
       ------------------------------------------------------------- */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'correct') {
          // 正確音效 (可愛上升三音程)
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.08);
            g.gain.setValueAtTime(0.2, now + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
            o.connect(g);
            g.connect(audioCtx.destination);
            o.start(now + idx * 0.08);
            o.stop(now + idx * 0.08 + 0.15);
          });
        } else if (type === 'wrong') {
          // 答錯音效
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.25);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'flip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {
        console.log('Audio Context Error', e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      if (soundEnabled) {
        icon.className = 'fa-solid fa-volume-high text-lg';
        playSound('click');
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-lg text-gray-400';
      }
    }

    /* -------------------------------------------------------------
       4. 背景動態氣泡與愛心特效粒子
       ------------------------------------------------------------- */
    function initFloatingBubbles() {
      const container = document.getElementById('bubble-bg');
      container.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = Math.random() * 40 + 20;
        b.style.width = `${size}px`;
        b.style.height = `${size}px`;
        b.style.left = `${Math.random() * 100}%`;
        b.style.animationDuration = `${Math.random() * 8 + 8}s`;
        b.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(b);
      }
    }

    // 答對時的愛心粒子噴發
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnParticles(x, y) {
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: x || window.innerWidth / 2,
          y: y || window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.8) * 10,
          size: Math.random() * 14 + 10,
          color: ['#ff758f', '#ffb3c6', '#cdb4db', '#ffc8dd', '#ffea9f'][Math.floor(Math.random() * 5)],
          alpha: 1,
          rotation: Math.random() * Math.PI * 2
        });
      }
    }

    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3; // 重力
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        // 繪製愛心形狀
        ctx.beginPath();
        const topCurveHeight = p.size * 0.3;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(0, 0, -p.size / 2, 0, -p.size / 2, topCurveHeight);
        ctx.bezierCurveTo(-p.size / 2, (p.size + topCurveHeight) / 2, 0, p.size, 0, p.size);
        ctx.bezierCurveTo(0, p.size, p.size / 2, (p.size + topCurveHeight) / 2, p.size / 2, topCurveHeight);
        ctx.bezierCurveTo(p.size / 2, 0, 0, 0, 0, topCurveHeight);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(updateParticles);
    }
    requestAnimationFrame(updateParticles);


    /* -------------------------------------------------------------
       5. 模式切換與初始化
       ------------------------------------------------------------- */
    function switchMode(mode) {
      playSound('click');
      currentMode = mode;
      const tabQuiz = document.getElementById('tab-quiz');
      const tabMemory = document.getElementById('tab-memory');
      const modeQuiz = document.getElementById('mode-quiz');
      const modeMemory = document.getElementById('mode-memory');

      if (mode === 'quiz') {
        tabQuiz.className = 'px-6 py-2 rounded-full text-sm font-bold transition shadow-sm bg-pink-400 text-white';
        tabMemory.className = 'px-6 py-2 rounded-full text-sm font-bold transition text-gray-600 hover:bg-white/50';
        modeQuiz.classList.remove('hidden');
        modeMemory.classList.add('hidden');
      } else {
        tabMemory.className = 'px-6 py-2 rounded-full text-sm font-bold transition shadow-sm bg-pink-400 text-white';
        tabQuiz.className = 'px-6 py-2 rounded-full text-sm font-bold transition text-gray-600 hover:bg-white/50';
        modeMemory.classList.remove('hidden');
        modeQuiz.classList.add('hidden');
      }
      resetGame();
    }

    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function resetGame() {
      if (currentMode === 'quiz') {
        initQuizMode();
      } else {
        initMemoryMode();
      }
    }


    /* -------------------------------------------------------------
       6. 模式一：看圖猜名字 邏輯
       ------------------------------------------------------------- */
    function initQuizMode() {
      quizQueue = shuffleArray([...SANRIO_CHARACTERS]);
      currentQuizIndex = 0;
      quizScore = 0;
      quizCombo = 0;
      updateQuizUI();
      loadQuizQuestion();
    }

    function updateQuizUI() {
      document.getElementById('quiz-progress').innerText = `${currentQuizIndex + 1}/${quizQueue.length}`;
      document.getElementById('quiz-score').innerText = quizScore;
      document.getElementById('quiz-combo').innerText = quizCombo;
    }

    function loadQuizQuestion() {
      if (currentQuizIndex >= quizQueue.length) {
        showFinalResult();
        return;
      }

      updateQuizUI();
      const currentCharacter = quizQueue[currentQuizIndex];

      // 載入 SVG
      const container = document.getElementById('character-svg-container');
      container.innerHTML = currentCharacter.svg;

      // 生成選項 (1 正確 + 3 錯誤)
      const wrongOptions = SANRIO_CHARACTERS
        .filter(c => c.id !== currentCharacter.id)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      
      const options = shuffleArray([currentCharacter, ...wrongOptions]);
      const optionsContainer = document.getElementById('quiz-options');
      optionsContainer.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'py-3.5 px-4 rounded-2xl bg-pink-50 hover:bg-pink-100 border-2 border-pink-200 text-gray-700 font-bold text-sm md:text-base transition transform active:scale-95 shadow-sm flex flex-col items-center justify-center';
        btn.innerHTML = `
          <span>${opt.nameZh}</span>
          <span class="text-xs font-normal text-purple-400">${opt.nameEn}</span>
        `;
        btn.onclick = (e) => handleQuizAnswer(opt.id, currentCharacter, e);
        optionsContainer.appendChild(btn);
      });
    }

    function handleQuizAnswer(selectedId, targetCharacter, event) {
      if (selectedId === targetCharacter.id) {
        // 答對
        playSound('correct');
        spawnParticles(event.clientX, event.clientY);
        quizCombo++;
        quizScore += 10 + (quizCombo > 1 ? (quizCombo - 1) * 5 : 0);
        updateQuizUI();

        // 顯示小知識彈窗
        setTimeout(() => {
          showTriviaModal(targetCharacter);
        }, 300);
      } else {
        // 答錯
        playSound('wrong');
        quizCombo = 0;
        updateQuizUI();
        
        // 晃動容器提示
        const container = document.getElementById('character-svg-container').parentElement;
        container.classList.add('shake');
        setTimeout(() => container.classList.remove('shake'), 500);

        // 標示出正確選項與錯誤選項
        const buttons = document.querySelectorAll('#quiz-options button');
        buttons.forEach(btn => {
          if (btn.innerText.includes(targetCharacter.nameZh)) {
            btn.classList.remove('bg-pink-50', 'border-pink-200');
            btn.classList.add('bg-green-100', 'border-green-400', 'text-green-800');
          }
        });
      }
    }

    function showTriviaModal(character) {
      document.getElementById('trivia-name-zh').innerText = character.nameZh;
      document.getElementById('trivia-name-en').innerText = character.nameEn;
      document.getElementById('trivia-birthday').innerText = character.birthday;
      document.getElementById('trivia-bio').innerText = character.bio;

      const modal = document.getElementById('trivia-modal');
      const card = document.getElementById('trivia-modal-card');
      modal.classList.remove('hidden');
      setTimeout(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeTriviaModal() {
      playSound('click');
      const modal = document.getElementById('trivia-modal');
      const card = document.getElementById('trivia-modal-card');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        currentQuizIndex++;
        loadQuizQuestion();
      }, 200);
    }


    /* -------------------------------------------------------------
       7. 模式二：記憶翻牌配對 邏輯
       ------------------------------------------------------------- */
    function initMemoryMode() {
      memoryMoves = 0;
      matchedCount = 0;
      flippedCards = [];
      isBusyFlipping = false;

      // 隨機選取 6 位角色進行 12 張牌的配對
      const selectedChars = shuffleArray([...SANRIO_CHARACTERS]).slice(0, 6);
      
      let deck = [];
      selectedChars.forEach(char => {
        // 卡片 A: SVG 插畫
        deck.push({ charId: char.id, type: 'svg', content: char.svg, data: char });
        // 卡片 B: 中英文名字
        deck.push({ charId: char.id, type: 'name', content: char.nameZh, data: char });
      });

      memoryCards = shuffleArray(deck);
      updateMemoryUI();
      renderMemoryGrid();
    }

    function updateMemoryUI() {
      document.getElementById('memory-moves').innerText = memoryMoves;
      document.getElementById('memory-matches').innerText = `${matchedCount} / 6`;
    }

    function renderMemoryGrid() {
      const grid = document.getElementById('memory-grid');
      grid.innerHTML = '';

      memoryCards.forEach((card, index) => {
        const scene = document.createElement('div');
        scene.className = 'card-scene h-28 md:h-36';

        const inner = document.createElement('div');
        inner.className = 'card-inner';
        inner.dataset.index = index;

        // 正面（蓋牌時顯示圖案）
        const front = document.createElement('div');
        front.className = 'card-face card-front text-white text-2xl font-bold';
        front.innerHTML = '🎀';

        // 背面（翻開時內容）
        const back = document.createElement('div');
        back.className = 'card-face card-back p-2 text-center';
        if (card.type === 'svg') {
          back.innerHTML = `<div class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center">${card.content}</div>`;
        } else {
          back.innerHTML = `
            <div>
              <p class="font-black text-pink-600 text-sm md:text-base">${card.data.nameZh}</p>
              <p class="text-xs text-purple-400 font-medium">${card.data.nameEn}</p>
            </div>
          `;
        }

        inner.appendChild(front);
        inner.appendChild(back);
        scene.appendChild(inner);

        inner.onclick = () => handleCardFlip(inner, index);
        grid.appendChild(scene);
      });
    }

    function handleCardFlip(cardElem, index) {
      if (isBusyFlipping) return;
      if (cardElem.classList.contains('is-flipped')) return;
      if (flippedCards.length >= 2) return;

      playSound('flip');
      cardElem.classList.add('is-flipped');
      flippedCards.push({ elem: cardElem, data: memoryCards[index] });

      if (flippedCards.length === 2) {
        memoryMoves++;
        updateMemoryUI();
        checkMemoryMatch();
      }
    }

    function checkMemoryMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.data.charId === card2.data.charId;

      if (isMatch) {
        playSound('correct');
        matchedCount++;
        updateMemoryUI();
        flippedCards = [];

        if (matchedCount === 6) {
          setTimeout(() => {
            showFinalResult();
          }, 600);
        }
      } else {
        isBusyFlipping = true;
        playSound('wrong');
        setTimeout(() => {
          card1.elem.classList.remove('is-flipped');
          card2.elem.classList.remove('is-flipped');
          flippedCards = [];
          isBusyFlipping = false;
        }, 1000);
      }
    }


    /* -------------------------------------------------------------
       8. 結算畫面與稱號判定
       ------------------------------------------------------------- */
    function showFinalResult() {
      let finalScoreText = '';
      let titleText = '';
      let detailText = '';

      if (currentMode === 'quiz') {
        finalScoreText = `${quizScore} 分`;
        if (quizScore >= 120) {
          titleText = '三麗鷗超級鐵粉 💖';
          detailText = '完美的表現！你對三麗鷗家族的角色簡直是瞭如指掌！';
        } else if (quizScore >= 70) {
          titleText = '三麗鷗好朋友 🎀';
          detailText = '做得好！你對大部分角色的名字都非常熟悉喔！';
        } else {
          titleText = '三麗鷗見習生 🌟';
          detailText = '再接再厲！多玩幾次就能把所有可愛角色的名字記住囉！';
        }
      } else {
        finalScoreText = `${memoryMoves} 步完成`;
        if (memoryMoves <= 10) {
          titleText = '記憶大師 🧠✨';
          detailText = '驚人的記憶力！只花了極少步數就完成配對！';
        } else if (memoryMoves <= 16) {
          titleText = '敏捷甜心 🌸';
          detailText = '表現優異！反應相當迅速呢！';
        } else {
          titleText = '努力小達人 💪';
          detailText = '順利完成了配對，繼續挑戰更少的步數吧！';
        }
      }

      document.getElementById('result-score').innerText = finalScoreText;
      document.getElementById('result-title').innerText = `「${titleText}」`;
      document.getElementById('result-detail').innerText = detailText;

      const modal = document.getElementById('result-modal');
      modal.classList.remove('hidden');
      spawnParticles(window.innerWidth / 2, window.innerHeight / 3);
    }

    function closeResultModal() {
      playSound('click');
      document.getElementById('result-modal').classList.add('hidden');
    }

    /* 初始化遊戲 */
    window.onload = () => {
      initFloatingBubbles();
      initQuizMode();
    };
  </script>
